<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chinese Culture Festival 2026</title>

    <link rel="icon" type="image/png" href="./assets/images/common/logo.png">
    <link rel="apple-touch-icon" href="./assets/images/common/logo.png">

    <link rel="stylesheet" href="./assets/css/base.css">
    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="stylesheet" href="./assets/css/header.css">
    <link rel="stylesheet" href="./assets/css/home.css">
    <link rel="stylesheet" href="./assets/css/about.css">
    <link rel="stylesheet" href="./assets/css/programme-genres.css">
    <link rel="stylesheet" href="./assets/css/programme-detail.css">
    <link rel="stylesheet" href="./assets/css/archives.css">
    <link rel="stylesheet" href="./assets/css/announcement.css">
    <link rel="stylesheet" href="./assets/css/news.css">
    <link rel="stylesheet" href="./assets/css/event-partners.css">
    <link rel="stylesheet" href="./assets/css/responsive.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>

<body class="home-page">

    <!-- Header -->
    <header
        id="site-header"
        data-beautyos-section="header"
        data-component="./components/common/header.html"
    >
        <div data-beautyos-block="header.nav"></div>
    </header>

    <!-- Main Page Content -->
    <main id="main-content" class="page-main">

        <!-- Hero Section -->
        <section
            id="hero"
            data-beautyos-section="hero"
            data-component="./components/home/hero.html"
        >
            <div data-beautyos-block="hero.content"></div>
        </section>

        <!-- Partners Section -->
        <section
            id="partners"
            data-beautyos-section="partners"
            data-component="./components/home/partners.html"
        >
            <div data-beautyos-block="partners.grid"></div>
        </section>

        <!-- About Section -->
        <section
            id="about-festival"
            data-beautyos-section="about"
            data-component="./components/home/about-festival.html"
        >
            <div data-beautyos-block="about.content"></div>
        </section>

        <!-- Featured Events Section -->
        <section
            id="featured-events"
            data-beautyos-section="featured-events"
            data-component="./components/home/featured-events.html"
        >
            <div data-beautyos-block="featured.grid"></div>
        </section>

        <!-- Recent Programmes Section -->
        <section
            id="recent-programmes"
            data-beautyos-section="recent-programmes"
            data-component="./components/home/recent-programmes.html"
        >
            <div data-beautyos-block="recent.grid"></div>
        </section>

    </main>

    <!-- Footer -->
    <footer
        id="site-footer"
        data-beautyos-section="footer"
        data-component="./components/common/footer.html"
    >
        <div data-beautyos-block="footer.content"></div>
    </footer>

    <!-- Sidebar (Loaded once) -->
    <div data-component="./components/common/sidebar.html"></div>

    <script src="./assets/data/programme-genres.js"></script>
    <script src="./assets/data/programme-detail.js"></script>
    <script src="./assets/js/component-loader.js"></script>
    <script src="./assets/js/header.js"></script>
    <script src="./assets/js/programmes.js"></script>
    <script src="./assets/js/about.js"></script>
    <script src="./assets/js/programme-genres.js"></script>
    <script src="./assets/js/programme-detail.js"></script>
    <script src="./assets/js/news.js"></script>
    <script src="./assets/js/home.js"></script>
    <script src="./assets/js/main.js"></script>

</body>

</html>
